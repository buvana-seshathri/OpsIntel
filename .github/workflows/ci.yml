name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: opsintel
          POSTGRES_PASSWORD: opsintel
          POSTGRES_DB: opsintel_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U opsintel -d opsintel_test"
          --health-interval 2s
          --health-retries 30
    env:
      TEST_DATABASE_URL: postgresql+psycopg://opsintel:opsintel@localhost:5432/opsintel_test
      RUN_FASTEMBED: "1"
      FASTEMBED_CACHE_PATH: /home/runner/.cache/fastembed
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - run: uv sync --frozen
      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: /home/runner/.cache/fastembed
          key: fastembed-bge-small-en-v1.5
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Typecheck
        run: uv run mypy src
      - name: Tests
        run: uv run pytest -v
