services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: opsintel
      POSTGRES_PASSWORD: opsintel
      POSTGRES_DB: opsintel
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opsintel"]
      interval: 2s
      retries: 30

  api:
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://opsintel:opsintel@db:5432/opsintel
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
